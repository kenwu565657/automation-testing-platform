services:
  zookeeper:
    image: zookeeper:3.9
    container_name: ${COMPOSE_PROJECT_NAME}-zookeeper
    restart: unless-stopped
    ports:
      - "2181:2181"
    environment:
      ZOO_4LW_COMMANDS_WHITELIST: ruok,stat,srvr
    volumes:
      - zookeeper-data:/data
      - zookeeper-datalog:/datalog
    networks:
      - platform-network
    healthcheck:
      test: ["CMD-SHELL", "echo ruok | nc localhost 2181 | grep -q imok"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
