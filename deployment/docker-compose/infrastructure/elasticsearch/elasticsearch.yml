services:
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:${ELASTICSEARCH_VERSION}
    container_name: ${COMPOSE_PROJECT_NAME}-elasticsearch
    hostname: elasticsearch
    restart: unless-stopped
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - xpack.security.http.ssl.enabled=false
      - "ES_JAVA_OPTS=${ES_JAVA_OPTS}"
    volumes:
      - elasticsearch-data:/usr/share/elasticsearch/data
    ports:
      - "9200:9200"
    networks:
      - platform-network
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s

  elasticsearch-init:
    image: curlimages/curl:8.11.1
    container_name: ${COMPOSE_PROJECT_NAME}-elasticsearch-init
    restart: "no"
    user: "0:0"
    depends_on:
      elasticsearch:
        condition: service_healthy
    entrypoint: ["/bin/sh", "/init/elasticsearch.sh"]
    volumes:
      - ./elasticsearch.sh:/init/elasticsearch.sh:ro
      - ../../../../platform-report/src/main/resources/elasticsearch/test-reports.json:/mapping/test-reports.json:ro
    networks:
      - platform-network