services:
  s3manager:
    profiles: [tools]
    image: cloudlena/s3manager:${S3MANAGER_VERSION}
    container_name: ${COMPOSE_PROJECT_NAME}-s3manager
    restart: unless-stopped
    depends_on:
      floci:
        condition: service_healthy
    ports:
      - "4567:8080"
    environment:
      ENDPOINT: floci:4566
      ACCESS_KEY_ID: test
      SECRET_ACCESS_KEY: test
      USE_SSL: "false"
      REGION: us-east-1
      BUCKET_LOOKUP: Path
    networks:
      - platform-network
