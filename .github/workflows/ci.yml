name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  checks: write
  pull-requests: write

jobs:
  backend-tests:
    name: Backend tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Backend tests
        run: ./gradlew coverageSummary --no-daemon

      - name: Upload JVM coverage summary
        uses: actions/upload-artifact@v4
        with:
          name: jvm-coverage-summary
          path: build/reports/coverage/jvm.json
          if-no-files-found: error

      - name: Upload JVM coverage reports
        uses: actions/upload-artifact@v4
        with:
          name: jvm-coverage-reports
          path: "**/build/reports/jacoco/test/"
          if-no-files-found: error

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-results
          path: "**/build/test-results/test/*.xml"
          if-no-files-found: ignore

      - name: Publish test results
        if: always()
        uses: dorny/test-reporter@v2
        with:
          name: Backend tests
          path: "**/build/test-results/test/*.xml"
          reporter: java-junit
          fail-on-empty: false
          fail-on-error: false

  node-tests:
    name: Node tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm

      - name: Test workspaces
        run: |
          npm ci
          npm test
          npm run test:workflow
          npm run test:coverage-tools
          npm run coverage:node

      - name: Upload Node coverage reports
        uses: actions/upload-artifact@v4
        with:
          name: node-coverage-reports
          path: |
            engines/k6/coverage/
            shared/typescript/engine/coverage/
          if-no-files-found: error

  coverage-summary:
    name: Coverage summary
    needs: [backend-tests, node-tests]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: jvm-coverage-summary
          path: build/reports/coverage
      - uses: actions/download-artifact@v4
        with:
          name: node-coverage-reports
          path: .
      - name: Summarize coverage and generate badges
        run: node scripts/coverage.mjs --badges
      - name: Upload badge data
        uses: actions/upload-artifact@v4
        with:
          name: coverage-badges
          path: build/coverage-pages/
          if-no-files-found: error

  publish-coverage:
    name: Publish coverage badges
    if: github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    needs: coverage-summary
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: coverage-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: coverage-badges
          path: coverage-pages
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: coverage-pages
      - id: deployment
        uses: actions/deploy-pages@v4
