server:
  port: 8080

spring:
  application:
    name: gateway-service
  cloud:
    gateway:
      server:
        webflux:
          # ── Global CORS ──
          globalcors:
            cors-configurations:
              '[/**]':
                allowedOrigins: "http://localhost:3000"
                allowedMethods: "*"
                allowedHeaders: "*"
                allowCredentials: true

          # ── Default filters for all routes ──
          default-filters:
            - DedupeResponseHeader=Access-Control-Allow-Credentials Access-Control-Allow-Origin

          # ── Route definitions ──
          routes:
            # Admin Service (Spring Boot)
            - id: admin-service
              uri: http://localhost:8081
              predicates:
                - Path=/api/admin/**
              filters:
                - StripPrefix=2
                # /api/admin/test-cases → /test-cases → admin-service:8081/test-cases

            # Engine Service (Vert.x)
            - id: engine-service
              uri: http://localhost:8082
              predicates:
                - Path=/api/engine/**
              filters:
                - StripPrefix=2

            # Report Service REST (Ktor)
            - id: report-service
              uri: http://localhost:8083
              predicates:
                - Path=/api/reports/**
              filters:
                - StripPrefix=2

            # Report Service WebSocket (Ktor)
            - id: report-service-ws
              uri: ws://localhost:8083
              predicates:
                - Path=/ws/**

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway