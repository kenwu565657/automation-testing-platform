server:
  port: 8081

spring:
  application:
    name: admin-service

  datasource:
    url: ${POSTGRES_URL:jdbc:postgresql://localhost:5432/testplatform}
    username: ${POSTGRES_USER:platform}
    password: ${POSTGRES_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

  kafka:
    bootstrap-servers: localhost:9093
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: com.valdifly.infrastructure.kafka.JsonSerializer
    consumer:
      group-id: admin-service
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      auto-offset-reset: earliest

management:
  server:
    # Separate, unpublished port: metrics/health stay off the public API surface.
    port: ${MANAGEMENT_SERVER_PORT:9081}
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  tracing:
    sampling:
      probability: ${MANAGEMENT_TRACING_SAMPLING_PROBABILITY:1.0}
  otlp:
    tracing:
      endpoint: ${MANAGEMENT_OTLP_TRACING_ENDPOINT:http://localhost:4318/v1/traces}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

elasticjob:
  server-lists: localhost:2181
  namespace: valdifly-elasticjob

platform:
  jwt:
    # No default: the service refuses to start without a real signing secret.
    secret: ${JWT_SECRET}
    access-ttl: ${JWT_ACCESS_TTL:PT1H}
    refresh-ttl: ${JWT_REFRESH_TTL:P7D}
  ai:
    base-url: ${PLATFORM_AI_BASE_URL:}
    api-key: ${PLATFORM_AI_API_KEY:}
    model: ${PLATFORM_AI_MODEL:gpt-4.1-mini}
    # Separate key from the JWT secret — one leak must not compromise the other.
    settings-secret: ${PLATFORM_AI_SETTINGS_SECRET}

s3:
  endpoint: ${AWS_ENDPOINT_URL:http://localhost:4566}
  region: ${AWS_DEFAULT_REGION:us-east-1}
  bucket: ${S3_BUCKET:valdifly-artifacts}
  access-key: ${AWS_ACCESS_KEY_ID}
  secret-key: ${AWS_SECRET_ACCESS_KEY}
  path-style: true
  presign-seconds: 900

---
# Docker profile
spring:
  config:
    activate:
      on-profile: docker
  flyway:
    enabled: true

elasticjob:
  server-lists: zookeeper:2181

---
# Local development profile (SPRING_PROFILES_ACTIVE=local): dev-only credentials so a
# bare `./gradlew bootRun` works. These values are public and must never appear in a
# real deployment — the default profile has no credential defaults on purpose.
spring:
  config:
    activate:
      on-profile: local
  datasource:
    password: platform123

platform:
  jwt:
    secret: local-dev-only-jwt-hmac-secret-32b
  ai:
    settings-secret: local-dev-only-ai-settings-secret-32b
    # Local LLMs (Ollama & co) live on private addresses; the SSRF guard allows them only here.
    allow-private-endpoints: true

s3:
  access-key: test
  secret-key: test