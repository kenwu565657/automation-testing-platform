openapi: 3.0.3
info:
  title: Platform API
  version: v1
  description: >
    STALE — predates the RestfulApiResponse envelope migration: every bodied 2xx
    response is now wrapped in { code, message, data, traceId }; the payload types
    below are the `data` contents and their field names are unchanged. 204s stay
    bodyless. Regenerate with the service running:
    curl -s localhost:8081/v3/api-docs.yaml -o platform-v1.yaml (from this directory)
    Write-side catalog, identity, organization, schedule, and run trigger.
    Principal is a JWT access token (claim sub = user id).
    Public path through the gateway is /api/admin/api/v1/... (StripPrefix=2).
    Create user, login, and refresh are unauthenticated.
    POST /api/v1/test-case/generate returns an unpersisted CreateTestCaseCommand draft.
    POST /api/v1/test-case/import returns unpersisted page-object and case drafts from pasted Selenium/Appium sources.
    Apply locator heals at POST /api/v1/page-object/{id}/heal.
    dataTable { name, rows } is optional for any AuthoringStyle (Scenario Outline or per-row repetition); use ${column} placeholders in steps.
    Device-farm inventory lives at /api/v1/device-slot. Triggering a run leases a matching slot; engine uses that URL instead of ExecutionTarget.remoteUrl.
    Users save their own provider URL and API key at /api/v1/ai-settings; the key is encrypted and never returned.
servers:
  - url: http://localhost:8080/api/admin
    description: Gateway (browser / Postman)
  - url: http://localhost:8081
    description: Admin direct
security:
  - bearer: []
tags:
  - name: Auth
  - name: User
  - name: AiSettings
  - name: Organization
  - name: OrganizationMembership
  - name: Project
  - name: TestCase
  - name: TestSuite
  - name: PageObject
  - name: Environment
  - name: DeviceProfile
  - name: DeviceSlot
  - name: ExecutionTarget
  - name: Schedule
  - name: RoleTemplate
  - name: Run
paths:
  /api/v1/auth/login:
    post:
      tags: [Auth]
      summary: Login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginCommand'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '401':
          description: Invalid credentials
  /api/v1/auth/refresh:
