      properties:
        id: { type: string }
        name: { type: string }
        description: { type: string }
        active: { type: boolean }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        createdBy: { type: string }
    GrantOrganizationMembershipCommand:
      type: object
      required: [userId, organizationId, roleTemplateId]
