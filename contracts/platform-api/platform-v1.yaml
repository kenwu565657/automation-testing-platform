            application/json:
              schema:
                $ref: '#/components/schemas/ScheduleResponse'
  /api/v1/schedule/{id}:
    get:
      tags: [Schedule]
      summary: Get schedule
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScheduleResponse'
    patch:
      tags: [Schedule]
      summary: Update schedule
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateScheduleCommand'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScheduleResponse'
    delete:
      tags: [Schedule]
      summary: Delete schedule
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '204':
          description: Deleted
  /api/v1/role-template:
    get:
      tags: [RoleTemplate]
      summary: List an organization's role templates
      parameters:
        - name: limit
          in: query
          required: false
          schema: { type: integer, default: 100, maximum: 500 }
        - name: offset
          in: query
          required: false
          schema: { type: integer, default: 0 }
        - name: organizationId
          in: query
          required: true
          schema: { type: string }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/RoleTemplateResponse' }
    post:
      tags: [RoleTemplate]
      summary: Create a role template (requires roleTemplate:Write on the organization)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateRoleTemplateCommand' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RoleTemplateResponse' }
  /api/v1/role-template/{id}:
    get:
      tags: [RoleTemplate]
      summary: Get a role template
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RoleTemplateResponse' }
    patch:
      tags: [RoleTemplate]
      summary: Update name/actions or deactivate (deactivate rejected while members are assigned)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateRoleTemplateCommand' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RoleTemplateResponse' }
  /api/v1/run:
    get:
      tags: [Execution]
      summary: List runs by suite
      parameters:
        - name: limit
          in: query
          required: false
          schema: { type: integer, default: 100, maximum: 500 }
        - name: offset
          in: query
          required: false
          schema: { type: integer, default: 0 }
        - name: testSuiteId
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TestRunResponse'
  /api/v1/run/trigger:
    post:
      tags: [Execution]
      summary: Trigger a run
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TriggerRunCommand'
      responses:
        '202':
          description: Queued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TriggerRunResponse'
  /api/v1/run/{id}:
    get:
      tags: [Execution]
      summary: Get run
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TestRunResponse'
  /api/v1/run/{id}/cancel:
    post:
      tags: [Execution]
      summary: Cancel a run
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TestRunResponse'
  /api/v1/run/{id}/artifact:
    get:
      tags: [Execution]
      summary: Presign an artifact
      parameters:
        - $ref: '#/components/parameters/Id'
        - name: key
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ArtifactUrlResponse'
components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    Id:
      name: id
      in: path
      required: true
      schema:
        type: string
    ProjectId:
      name: projectId
      in: query
      required: true
      schema:
        type: string
    OrganizationId:
      name: organizationId
      in: query
      required: true
      schema:
        type: string
    OrganizationIdQuery:
      name: organizationId
      in: query
      required: false
      schema:
        type: string
  schemas:
    ErrorResponse:
      type: object
      properties:
        code:
          type: integer
          description: "<HTTP status><2-digit sequence>, e.g. 40401"
          example: 40401
        message:
          type: string
          example: "Not found"
        traceId:
          type: string
    TestType:
      type: string
      enum: [WEB_E2E, MOBILE_E2E, API, LOAD_TEST]
    AuthoringStyle:
      type: string
      enum: [SIMPLE, GHERKIN]
    Priority:
      type: string
      enum: [LOW, MEDIUM, HIGH, CRITICAL]
    Action:
      type: string
      enum: [['ORGANIZATION_GET','ORGANIZATION_UPDATE','ORGANIZATION_DELETE','ORGANIZATION_MANAGE_MEMBERS','ORGANIZATION_CREATE_PROJECT','PROJECT_GET','PROJECT_UPDATE','PROJECT_DELETE','PROJECT_MANAGE_MEMBERS','CATALOG_READ','CATALOG_WRITE','ENVIRONMENT_READ','ENVIRONMENT_WRITE','TARGET_READ','TARGET_WRITE','SCHEDULE_READ','SCHEDULE_WRITE','RUN_READ','RUN_TRIGGER','RUN_CANCEL','REPORT_READ','ROLE_TEMPLATE_WRITE']]
    RoleTemplateResponse:
      type: object
      properties:
        id: { type: string }
        organizationId: { type: string }
        name: { type: string }
        actions:
          type: array
          items: { $ref: '#/components/schemas/Action' }
        active: { type: boolean }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    CreateRoleTemplateCommand:
      type: object
      required: [organizationId, name, actions]
      properties:
        organizationId: { type: string }
        name: { type: string, minLength: 1 }
        actions:
          type: array
          minItems: 1
          items: { $ref: '#/components/schemas/Action' }
    UpdateRoleTemplateCommand:
      type: object
      properties:
        name: { type: string, minLength: 1 }
        actions:
          type: array
          minItems: 1
          items: { $ref: '#/components/schemas/Action' }
        active: { type: boolean }
    PlatformType:
      type: string
      enum: [WEB_DESKTOP, WEB_MOBILE, NATIVE_MOBILE]
    OSType:
      type: string
      enum: [WINDOWS, MACOS, LINUX, ANDROID, IOS]
    BrowserType:
      type: string
      enum: [CHROME, FIREFOX, EDGE, SAFARI]
    TriggerKind:
      type: string
      enum: [MANUAL, SCHEDULE]
    RunStatus:
      type: string
      enum: [QUEUED, RUNNING, PASSED, FAILED, ERROR, SKIPPED, CANCELLED]
    LocatorStrategy:
      type: string
      enum:
        - ID
        - NAME
        - CSS_SELECTOR
        - XPATH
        - CLASS_NAME
        - TAG_NAME
        - LINK_TEXT
        - PARTIAL_LINK_TEXT
        - ACCESSIBILITY_ID
        - ANDROID_UIAUTOMATOR
        - ANDROID_VIEWTAG
        - ANDROID_DATA_MATCHER
        - IOS_PREDICATE
        - IOS_CLASS_CHAIN
    LoginCommand:
      type: object
      required: [email, password]
      properties:
        email: { type: string }
        password: { type: string, minLength: 8 }
    RefreshTokenCommand:
      type: object
      required: [refreshToken]
      properties:
        refreshToken: { type: string }
    TokenResponse:
      type: object
      properties:
        accessToken: { type: string }
        refreshToken: { type: string }
        tokenType: { type: string }
        expiresIn: { type: integer, format: int64 }
        userId: { type: string }
        email: { type: string }
    CreateUserCommand:
      type: object
      required: [email, displayName, password]
      properties:
        email:
          type: string
        displayName:
          type: string
        password:
          type: string
          minLength: 8
    UpdateUserCommand:
      type: object
      properties:
        displayName:
          type: string
        email:
          type: string
        active:
          type: boolean
        password:
          type: string
          minLength: 8
    UserResponse:
      type: object
      properties:
        id: { type: string }
        email: { type: string }
        displayName: { type: string }
        active: { type: boolean }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    UpdateAiSettingsCommand:
      type: object
      required: [baseUrl]
      properties:
        baseUrl: { type: string }
        model: { type: string }
        apiKey: { type: string }
        clearApiKey: { type: boolean }
    AiSettingsResponse:
      type: object
      properties:
        baseUrl: { type: string }
