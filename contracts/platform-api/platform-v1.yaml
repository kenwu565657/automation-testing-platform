  /api/v1/ai-settings:
    get:
      tags: [AiSettings]
      summary: Get the current user's AI provider settings
      description: >
        Returns this user's saved provider, or the platform default when none is saved.
        The raw API key is never returned. User keys include apiKeyHint (last four characters).
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AiSettingsResponse'
    put:
      tags: [AiSettings]
      summary: Save the current user's AI provider settings
      description: >
        Encrypts and stores baseUrl, model, and optional apiKey for this user.
        Omit apiKey to keep the existing key. Set clearApiKey to drop the stored key.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateAiSettingsCommand'
      responses:
        '200':
          description: Saved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AiSettingsResponse'
    delete:
      tags: [AiSettings]
      summary: Revert to the platform AI default
      responses:
        '204':
          description: Deleted; the platform default applies from here on
